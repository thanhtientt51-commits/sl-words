var tabs=Object.keys(words);

// Render tabs
var tabsHTML='<div class="tab active" onclick="switchTab(\'all\',this)">全部</div>';
tabs.forEach(function(c){ tabsHTML+='<div class="tab" onclick="switchTab(\''+c+'\',this)">'+c+'</div>'; });
document.getElementById('tabs').innerHTML=tabsHTML;

function switchTab(cat,el){
  currentTab=cat;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  renderWords();
}

function renderWords(){
  var search=document.getElementById('searchInput').value.trim().toLowerCase();
  var pool=[];
  if(currentTab==='all'){
    tabs.forEach(function(c){ words[c].forEach(function(w){ pool.push(w); }); });
  }else{
    pool=words[currentTab];
  }
  if(search){
    pool=pool.filter(function(w){ return w.f.indexOf(search)!==-1||w.c.indexOf(search)!==-1; });
  }
  document.getElementById('countBar').textContent='共 '+pool.length+' 组规范词';
  var html='';
  pool.forEach(function(w){
    html+='<div class="word-card"><div class="formal">'+w.f+'</div><div class="casual">'+w.c+'</div></div>';
  });
  document.getElementById('wordGrid').innerHTML=html;
}
